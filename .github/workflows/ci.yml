name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet, test, race, bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v ./...

      - name: go test -race
        run: CGO_ENABLED=1 go test -race ./...

      - name: bench (savings table + equality)
        run: make bench

  build-matrix:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/wiretuple ./cmd/wiretuple
          go build -trimpath -ldflags="-s -w" -o /tmp/wiretuple-bench ./cmd/wiretuple-bench

      - name: verify static binary metadata
        if: matrix.goos == 'linux'
        run: file /tmp/wiretuple
